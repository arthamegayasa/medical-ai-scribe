<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img" aria-labelledby="title desc">
<title id="title">How Medical AI Scribe works</title><desc id="desc">Audio optionally goes to a transcription provider. The editable transcript is sent through a server-side adapter to the selected language model. A clinician edits and exports the returned SOAP draft. Keys remain on the server; the app has no patient database.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5" fill="#629a9e"/></marker></defs>
<rect width="1440" height="450" rx="18" fill="#f0f6f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="56" fill="#183640" font-size="24" font-weight="650">One focused workflow.</text><text x="52" y="85" fill="#617f88" font-size="14">Separate transcription from note generation. Review the source before the draft.</text>
<g fill="#fff" stroke="#d5e3e6"><rect x="52" y="151" width="232" height="172" rx="12"/><rect x="339" y="151" width="232" height="172" rx="12"/><rect x="626" y="151" width="232" height="172" rx="12"/><rect x="913" y="151" width="232" height="172" rx="12"/><rect x="1200" y="151" width="188" height="172" rx="12"/></g>
<g fill="#328e85" font-size="11" font-weight="650" letter-spacing="2"><text x="73" y="182">01 / CAPTURE</text><text x="360" y="182">02 / VERIFY</text><text x="647" y="182">03 / STRUCTURE</text><text x="934" y="182">04 / REVIEW</text><text x="1221" y="182">05 / EXPORT</text></g>
<g fill="#183640" font-size="19" font-weight="600"><text x="73" y="220">Audio or text</text><text x="360" y="220">Editable transcript</text><text x="647" y="220">Your selected AI</text><text x="934" y="220">SOAP draft</text><text x="1221" y="220">Your note</text></g>
<g fill="#69858b" font-size="13"><text x="73" y="254">Paste text, record, or upload</text><text x="73" y="278">Optional transcription API</text><text x="360" y="254">Check names and numbers</text><text x="360" y="278">Then choose a model</text><text x="647" y="254">Server-side provider adapter</text><text x="647" y="278">English or Indonesian</text><text x="934" y="254">Correct and verify every field</text><text x="934" y="278">Clinician judgment stays central</text><text x="1221" y="254">Copy or Markdown</text><text x="1221" y="278">Always labeled draft</text></g>
<g stroke="#629a9e" stroke-width="2" marker-end="url(#arrow)"><path d="M293 237h34M580 237h34M867 237h34M1154 237h34"/></g>
<text x="52" y="382" fill="#56767e" font-size="13">Keys stay on the server. Live requests reach your configured provider. No patient database or automatic browser storage.</text><text x="52" y="410" fill="#839da3" font-size="12">A documentation tool for evaluation and clinician review; not autonomous diagnosis, prescribing, or an EHR.</text></g></svg>
