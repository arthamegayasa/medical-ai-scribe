<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Where data goes in Medical AI Scribe</title>
  <desc id="flow-desc">Default browser-direct mode: the website host sends only the app files; the browser sends audio and text with the user's key straight to the AI provider. Optional server mode: the browser sends audio and text with a workspace access token to the deployer's server, which calls the provider with a server-held key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrowhead-muted"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f4f6f5; stroke: #dbe2df; }
    .card { fill: #ffffff; stroke: #c3ccc8; }
    .card-accent { fill: #ffffff; stroke: #0b6e5f; }
    .ink { fill: #15242b; }
    .ink2 { fill: #4b5b61; }
    .ink3 { fill: #5c6c71; }
    .rule { stroke: #dbe2df; }
    .accent { fill: #0b6e5f; }
    .flow { stroke: #0b6e5f; }
    .flow-muted { stroke: #5c6c71; }
    .arrowhead { fill: #0b6e5f; }
    .arrowhead-muted { fill: #5c6c71; }
    .chip { fill: #e2f1ec; }
    .chip-review { fill: #fbefe0; }
    .review { fill: #934a05; }
    .label-bg { fill: #f4f6f5; }
    .serif { font-family: "Source Serif 4", "Iowan Old Style", Charter, Georgia, "Times New Roman", serif; }
    .sans { font-family: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1517; stroke: #263538; }
      .card { fill: #152023; stroke: #34474a; }
      .card-accent { fill: #152023; stroke: #5cc3ab; }
      .ink { fill: #e3eae8; }
      .ink2 { fill: #a3b3b2; }
      .ink3 { fill: #8a9b9b; }
      .rule { stroke: #263538; }
      .accent { fill: #5cc3ab; }
      .flow { stroke: #5cc3ab; }
      .flow-muted { stroke: #8a9b9b; }
      .arrowhead { fill: #5cc3ab; }
      .arrowhead-muted { fill: #8a9b9b; }
      .chip { fill: #15332d; }
      .chip-review { fill: #33240f; }
      .review { fill: #eaa65c; }
      .label-bg { fill: #0e1517; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1279" height="719" rx="20"/>

  <!-- ========== Browser-direct ========== -->
  <text class="sans accent" x="56" y="62" font-size="12.5" font-weight="700" letter-spacing="2">DEFAULT</text>
  <text class="serif ink" x="56" y="94" font-size="26" font-weight="600">Browser-direct, bring your own key</text>

  <!-- Host -->
  <rect class="card" x="56" y="128" width="300" height="176" rx="14"/>
  <text class="sans ink3" x="80" y="160" font-size="11.5" font-weight="700" letter-spacing="1.6">WEBSITE HOST</text>
  <text class="serif ink" x="80" y="192" font-size="19">Serves the app files</text>
  <text class="sans ink2" x="80" y="222" font-size="14">HTML, CSS and JavaScript only.</text>
  <text class="sans ink2" x="80" y="244" font-size="14">Never receives your key, your</text>
  <text class="sans ink2" x="80" y="266" font-size="14">audio, transcripts or notes.</text>

  <!-- Browser -->
  <rect class="card-accent" x="490" y="128" width="300" height="236" rx="14" stroke-width="2"/>
  <text class="sans accent" x="514" y="160" font-size="11.5" font-weight="700" letter-spacing="1.6">YOUR BROWSER</text>
  <text class="serif ink" x="514" y="192" font-size="19">Runs the whole workflow</text>
  <rect class="chip" x="514" y="208" width="252" height="30" rx="8"/>
  <text class="sans ink" x="528" y="228" font-size="13.5">Your API key: this tab only by default</text>
  <rect class="chip" x="514" y="246" width="252" height="30" rx="8"/>
  <text class="sans ink" x="528" y="266" font-size="13.5">Recording, segmenting, transcript</text>
  <rect class="chip" x="514" y="284" width="252" height="30" rx="8"/>
  <text class="sans ink" x="528" y="304" font-size="13.5">Draft, evidence check, export</text>
  <rect class="chip-review" x="514" y="322" width="252" height="30" rx="8"/>
  <text class="sans review" x="528" y="342" font-size="13.5">History: off unless you turn it on</text>

  <!-- Provider -->
  <rect class="card" x="924" y="128" width="300" height="176" rx="14"/>
  <text class="sans ink3" x="948" y="160" font-size="11.5" font-weight="700" letter-spacing="1.6">AI PROVIDER YOU CHOSE</text>
  <text class="serif ink" x="948" y="192" font-size="19">Transcribes and drafts</text>
  <text class="sans ink2" x="948" y="222" font-size="14">Under its own data terms.</text>
  <text class="sans ink2" x="948" y="244" font-size="14">A local model (Ollama, LM Studio)</text>
  <text class="sans ink2" x="948" y="266" font-size="14">keeps this step on your machine.</text>

  <!-- Flows -->
  <line class="flow-muted" x1="358" y1="196" x2="486" y2="196" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text class="sans ink3" x="422" y="184" font-size="12.5" text-anchor="middle">app files</text>

  <line class="flow" x1="792" y1="190" x2="920" y2="190" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="sans accent" x="856" y="178" font-size="12.5" font-weight="700" text-anchor="middle">HTTPS + your key</text>
  <line class="flow" x1="920" y1="226" x2="794" y2="226" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="sans ink3" x="856" y="250" font-size="12.5" text-anchor="middle">transcript, draft</text>

  <line class="rule" x1="56" y1="404" x2="1224" y2="404" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ========== Server mode ========== -->
  <text class="sans ink3" x="56" y="452" font-size="12.5" font-weight="700" letter-spacing="2">OPTIONAL, FOR SELF-HOSTERS</text>
  <text class="serif ink" x="56" y="484" font-size="26" font-weight="600">Server mode, keys held by the deployment</text>

  <rect class="card" x="56" y="516" width="300" height="152" rx="14"/>
  <text class="sans ink3" x="80" y="548" font-size="11.5" font-weight="700" letter-spacing="1.6">YOUR BROWSER</text>
  <text class="serif ink" x="80" y="580" font-size="19">Holds no provider key</text>
  <text class="sans ink2" x="80" y="610" font-size="14">Sends a workspace access token.</text>
  <text class="sans ink2" x="80" y="632" font-size="14">Still checks evidence locally.</text>

  <rect class="card-accent" x="490" y="516" width="300" height="152" rx="14" stroke-width="2"/>
  <text class="sans accent" x="514" y="548" font-size="11.5" font-weight="700" letter-spacing="1.6">YOUR SERVER  /api/*</text>
  <text class="serif ink" x="514" y="580" font-size="19">Sees audio and text</text>
  <text class="sans ink2" x="514" y="610" font-size="14">Keys in environment variables,</text>
  <text class="sans ink2" x="514" y="632" font-size="14">SCRIBE_ACCESS_TOKEN gate.</text>

  <rect class="card" x="924" y="516" width="300" height="152" rx="14"/>
  <text class="sans ink3" x="948" y="548" font-size="11.5" font-weight="700" letter-spacing="1.6">AI PROVIDER</text>
  <text class="serif ink" x="948" y="580" font-size="19">Configured by the deployer</text>
  <text class="sans ink2" x="948" y="610" font-size="14">Or an OpenAI-compatible server</text>
  <text class="sans ink2" x="948" y="632" font-size="14">you run yourself.</text>

  <line class="flow-muted" x1="358" y1="584" x2="486" y2="584" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text class="sans ink3" x="422" y="572" font-size="12.5" text-anchor="middle">token + content</text>
  <line class="flow-muted" x1="792" y1="584" x2="920" y2="584" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text class="sans ink3" x="856" y="572" font-size="12.5" text-anchor="middle">server key</text>
</svg>
