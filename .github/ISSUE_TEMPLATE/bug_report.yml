name: Bug report
description: Something does not work as described, or a draft or export is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **Never include real patient data, recordings or API keys.** Use a fictional or fully de-identified example.
        Security problems (for example a key or clinical content reaching the wrong place) belong in a [private report](https://github.com/arthamegayasa/medical-ai-scribe/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /app/ and load the fictional example
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Fictional example (no key)
        - Browser-direct (my own key)
        - Server mode (self-hosted, server keys)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted app (medicalaiscribe.vercel.app)
        - Self-hosted on Vercel
        - Self-hosted elsewhere
        - Local development (npm run dev)
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: For example "OpenAI gpt-transcribe for audio, Anthropic claude-sonnet-5-5 for the note". Leave empty if not relevant.
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Edge 142 on Windows 11
  - type: textarea
    id: example
    attributes:
      label: Fictional example, error message or screenshot
      description: A short fictional transcript that reproduces a draft problem, the exact error text shown, or a screenshot without personal data.
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real patient data and no API keys or access tokens.
          required: true
